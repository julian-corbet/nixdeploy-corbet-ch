[package]
name = "nixdeploy"
version = "0.1.0"
edition = "2021"
description = "Publisher and receiver in one binary: signs a manifest naming what each machine should run, and on each machine sizes that change against its OWN store from narinfo metadata before activating, refusing, or routing the refusal to a reimage -- never a run that delivers nothing and reports success"
homepage = "https://github.com/julian-corbet/nixdeploy-corbet-ch"
license = "MIT"
publish = false

# Everything is in the library; `main.rs` is argument parsing and printing over it. Cargo can
# only link integration tests (tests/) against a LIBRARY target, never a binary one, so a
# crate whose logic lives in the binary can only be tested end to end by spawning the built
# executable and scraping its stdout -- which cannot inject a fake store, a fake substituter
# or a fake clock, and so cannot test the assembly of the pipeline at all. That is precisely
# the seam this crate needs covered: publish-then-receive as one round trip, and manifest ->
# delta -> activation as one path (tests/pipeline_test.rs).
[lib]
name = "nixdeploy"
path = "src/lib.rs"

[[bin]]
name = "nixdeploy"
path = "src/main.rs"

[dependencies]
# The manifest and every Outcome are JSON on the wire/on stdout; the on-disk receiver
# config (receive.rs) is JSON too, rendered by whatever Nix module builds it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Manifest signature verification (manifest.rs). The manifest names store paths this
# receiver will go on to activate, so this is the one dependency the "verify BEFORE
# trusting any path" rule in the README rests on.
ed25519-dalek = "2"

# Decodes the base64 key/signature text nixdeploy.receiver.manifest.publicKey and the
# detached manifest .sig carry -- the same "name:base64" text format `nix-store
# --generate-binary-cache-key` already produces, so an operator who already manages a
# binary cache signing key is not asked to learn a second key format.
base64 = "0.22"

# Deployment-set IDs and immutable release/journal byte digests. The digest is identity,
# not authentication; ed25519 remains the trust boundary.
sha2 = "0.10"

# HTTPS client for both the manifest fetch (manifest.rs) and the .narinfo fetch
# (delta.rs). Chosen over reqwest for the same reason nixnet prefers small dependencies
# on machines with little RAM to spare: a blocking, synchronous client is enough for a
# receiver that runs once per tick and does nothing concurrently.
ureq = { version = "2", features = ["tls"] }

# gethostname(2) (receive.rs): the manifest is one combined document keyed by hostname (see
# lib/manifest.nix), so the receiver needs its own hostname to find its entry in it. Reused
# from nixnet's own dependency list rather than shelling out to a `hostname` command or a
# higher-level crate for one syscall.
libc = "0.2"
